name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish artifacts to, for example 0.0.1 or v0.1.0"
        required: true
        type: string

jobs:
  release:
    name: Release (${{ matrix.platform }}${{ matrix.target && format(' / {0}', matrix.target) || '' }})
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/flipflopper
            archive: FlipFlopper-macos-aarch64-binary.tar.gz
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/flipflopper
            archive: FlipFlopper-macos-x86_64-binary.tar.gz
          - platform: ubuntu-22.04
            target: ''
            args: ''
            binary: target/release/flipflopper
            archive: FlipFlopper-linux-x86_64-binary.tar.gz
          - platform: windows-latest
            target: ''
            args: ''
            binary: target/release/flipflopper.exe
            archive: FlipFlopper-windows-x86_64-binary.tar.gz

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Agent runtime cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/agent-runtime/node_modules
            src-tauri/agent-runtime/NODE-LICENSE
          key: agent-runtime-${{ runner.os }}-${{ matrix.target || 'host' }}-${{ hashFiles('scripts/prepare-agents.mjs', 'src-tauri/agent-runtime/package-lock.json') }}

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TARGET: ${{ matrix.target }}
          # Tauri 2 names; retain the existing repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          # macOS signing / notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (Authenticode). No-op until the secrets below are set.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "FlipFlopper ${{ env.RELEASE_TAG }}"
          releaseBody: |
            FlipFlopper 0.21.0 introduces enhanced slash command integration, an interactive
            MCP server & skills inspector, seamless headless skill execution, wider responsive
            conversation columns, and queued message steering (Ctrl+Enter).

            Installers include the pinned Node sidecar and Claude ACP helper. Native
            Claude requires macOS 13.5+ on a Mac.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package binary
        shell: bash
        run: |
          mkdir -p artifacts/binary
          cp "${{ matrix.binary }}" artifacts/binary/
          mkdir -p artifacts/binary/agent-runtime
          cp -R src-tauri/agent-runtime/node_modules artifacts/binary/agent-runtime/
          cp src-tauri/agent-runtime/NODE-LICENSE artifacts/binary/agent-runtime/
          node scripts/package-agent-runtime.mjs "${{ matrix.binary }}" artifacts/binary
          tar -czf "artifacts/${{ matrix.archive }}" -C artifacts/binary .

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TARGET: ${{ matrix.target }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "artifacts/${{ matrix.archive }}" --clobber

  publish:
    name: Publish completed release
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  update-cask:
    name: Update Homebrew Cask
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Homebrew Tap Cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Clone the tap repository
          git clone https://x-access-token:${TAP_TOKEN}@github.com/AraujoJordan/homebrew-tap.git temp-tap
          cd temp-tap
          
          # Run the update script with the released version tag
          # (Strips any leading 'v' if present for semantic versioning consistency)
          CLEAN_TAG=$(echo "${RELEASE_TAG}" | sed 's/^v//')
          
          # Give GitHub releases a few seconds to ensure files are fully available/propagated
          sleep 10
          
          ./update.sh "$CLEAN_TAG"
          
          # Verify that the cask file has actual SHA256 hashes instead of fallbacks
          if grep -q "PASTE_ARM64_SHA256_HERE" Casks/flipflopper.rb || grep -q "PASTE_INTEL_SHA256_HERE" Casks/flipflopper.rb; then
            echo "Error: DMG downloads failed, SHA placeholders present in Cask file."
            exit 1
          fi
          
          # Commit and push changes back to the tap
          git add Casks/flipflopper.rb
          git commit -m "chore: bump flipflopper to $CLEAN_TAG" || echo "No changes to commit"
          git push origin main
