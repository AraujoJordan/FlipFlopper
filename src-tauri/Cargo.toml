[package]
name = "flipflopper"
version = "0.19.0"
description = "Multi-agent CLI cockpit — better UX for AI coding tools"
authors = ["araujojordan"]
edition = "2021"
license = "MIT"

[lib]
name = "flipflopper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener  = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os      = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
base64              = "0.22.1"
agent-client-protocol = "=3.5.0"
# The ACP SDK's async transport uses futures I/O. Spawn locally so each
# connection gets its own working directory and app-owned process lifetime.
async-process       = "2"
futures             = "0.3"

# PTY — cross-platform terminal multiplexing (Unix + Windows ConPTY)
portable-pty  = "0.8"

# Session IDs
uuid          = { version = "1", features = ["v4"] }

# Binary detection for agent/tool discovery
which         = "6"

# .gitignore-aware directory walker (ripgrep's ignore crate)
ignore        = "0.4"

# Async process execution, timeouts and main-thread result channels.
tokio         = { version = "1", features = ["process", "sync", "time", "rt", "macros"] }

# Home directory detection (cross-platform)
dirs          = "5"
